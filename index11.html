<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Smith - Digital Business Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter / Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        limeBrand: {
                            light: '#b6f200',
                            DEFAULT: '#91d700',
                            card: '#aee800',
                            cardDark: '#9ed600',
                        },
                        navyBrand: {
                            DEFAULT: '#0a122c',
                            dark: '#050917',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050917;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Custom scrollbar for mobile frame */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Vibrant Electric Lime Gradient Background */
        .lime-gradient-bg {
            background: linear-gradient(180deg, #a3e600 0%, #91d700 40%, #83c400 100%);
        }

        /* Hero Image Top Gradient Overlay to blend B&W image seamlessly */
        .lime-hero-overlay {
            background: linear-gradient(180deg, rgba(163, 230, 0, 0.15) 0%, rgba(145, 215, 0, 0.75) 60%, #91d700 100%);
        }
    </style>
</head>
<body class="p-0 sm:p-4">

    <!-- Main Container / Mobile Phone Outer Frame -->
    <div class="relative w-full max-w-[390px] h-[100vh] sm:h-[820px] lime-gradient-bg sm:rounded-[42px] shadow-2xl overflow-hidden flex flex-col border-0 sm:border-[8px] sm:border-slate-800">
        
        <!-- Phone Top Speaker/Camera notch simulation -->
        <div class="hidden sm:flex justify-center pt-2.5 pb-1 z-30 absolute top-0 inset-x-0">
            <div class="w-24 h-4 bg-slate-900 rounded-full flex items-center justify-center">
                <div class="w-3 h-3 bg-slate-800 rounded-full mr-2"></div>
                <div class="w-2 h-2 bg-slate-800 rounded-full"></div>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto no-scrollbar relative text-navyBrand-DEFAULT pb-28 pt-2 sm:pt-6">
            
            <!-- Hero Photo Header with B&W Image + Lime Gradient Overlay -->
            <div class="relative w-full h-[380px] overflow-hidden">
                <!-- Black & White Profile Photo -->
                <img 
                    src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=800&auto=format&fit=crop" 
                    alt="Kevin Smith" 
                    class="w-full h-full object-cover object-top filter grayscale contrast-125"
                    onerror="this.src='https://placehold.co/400x500/91d700/0a122c?text=Kevin+Smith'"
                />

                <!-- Lime Gradient Fade Overlay -->
                <div class="absolute inset-0 lime-hero-overlay flex flex-col justify-end px-6 pb-2">
                    <!-- Bold Navy Name -->
                    <h1 class="text-3xl font-black leading-none tracking-tight text-navyBrand-DEFAULT uppercase">
                        KEVIN<br/>SMITH
                    </h1>
                    <!-- Subtitle Title -->
                    <p class="text-sm font-semibold text-navyBrand-DEFAULT/90 mt-2 tracking-wide">
                        Sr. Marketing Manager
                    </p>
                </div>
            </div>

            <!-- Quick Action Icon Buttons Bar (White Circles with Navy Icons) -->
            <div class="px-6 py-4 flex items-center justify-between">
                <!-- Phone Call -->
                <a href="tel:+1234567890" class="w-12 h-12 rounded-full bg-white text-navyBrand-DEFAULT flex items-center justify-center shadow-md hover:bg-slate-100 transition-all active:scale-95">
                    <i class="fa-solid fa-mobile-screen-button text-xl"></i>
                </a>
                <!-- Email -->
                <a href="mailto:kevin.smith@example.com" class="w-12 h-12 rounded-full bg-white text-navyBrand-DEFAULT flex items-center justify-center shadow-md hover:bg-slate-100 transition-all active:scale-95">
                    <i class="fa-regular fa-envelope text-xl"></i>
                </a>
                <!-- Message / Chat -->
                <a href="sms:+1234567890" class="w-12 h-12 rounded-full bg-white text-navyBrand-DEFAULT flex items-center justify-center shadow-md hover:bg-slate-100 transition-all active:scale-95">
                    <i class="fa-regular fa-comment-dots text-xl"></i>
                </a>
                <!-- WhatsApp -->
                <a href="https://wa.me/1234567890" target="_blank" rel="noopener noreferrer" class="w-12 h-12 rounded-full bg-white text-navyBrand-DEFAULT flex items-center justify-center shadow-md hover:bg-slate-100 transition-all active:scale-95">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </a>
            </div>

            <!-- Content Card 1: About Me -->
            <div class="px-5 mt-1">
                <div class="bg-limeBrand-card/80 backdrop-blur-sm rounded-3xl p-5 shadow-sm border border-white/20 text-center">
                    <h2 class="text-xl font-extrabold text-navyBrand-DEFAULT">
                        About Me
                    </h2>
                    <p class="text-xs font-semibold text-navyBrand-DEFAULT/90 mt-2 leading-relaxed max-w-[260px] mx-auto">
                        I am John doe, working as marketing manager at D. Agency
                    </p>
                </div>
            </div>

            <!-- Content Card 2: Achievement (Partially visible above bottom dock) -->
            <div class="px-5 mt-4">
                <div class="bg-limeBrand-card/80 backdrop-blur-sm rounded-3xl p-5 shadow-sm border border-white/20 text-center">
                    <h2 class="text-xl font-extrabold text-navyBrand-DEFAULT">
                        Achievement
                    </h2>
                    <p class="text-xs font-semibold text-navyBrand-DEFAULT/90 mt-1">
                        Creative. Dedicated. Inquisitive.
                    </p>
                </div>
            </div>

        </div>

        <!-- Sticky Floating Bottom Navigation Bar -->
        <div class="absolute bottom-4 left-4 right-4 z-20 flex items-center justify-between gap-2">
            
            <!-- Left Action Buttons -->
            <div class="flex items-center gap-2">
                <!-- QR Code Button -->
                <button onclick="toggleModal('qrModal')" class="w-11 h-11 bg-navyBrand-DEFAULT text-white rounded-2xl flex items-center justify-center shadow-2xl hover:bg-slate-900 transition-all active:scale-95 border border-slate-800">
                    <i class="fa-solid fa-qrcode text-base"></i>
                </button>
                <!-- Share Button -->
                <button onclick="shareCard()" class="w-11 h-11 bg-navyBrand-DEFAULT text-white rounded-2xl flex items-center justify-center shadow-2xl hover:bg-slate-900 transition-all active:scale-95 border border-slate-800">
                    <i class="fa-solid fa-arrow-up-from-bracket text-base"></i>
                </button>
            </div>

            <!-- Add to Contact Pill Button -->
            <button onclick="downloadVCard()" class="flex-1 bg-navyBrand-DEFAULT text-white h-11 rounded-full px-4 flex items-center justify-between shadow-2xl hover:bg-slate-900 transition-all active:scale-95 border border-slate-800">
                <span class="text-xs font-semibold tracking-wide ml-2">Add to Contact</span>
                <span class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-white text-xs">
                    <i class="fa-solid fa-plus"></i>
                </span>
            </button>
        </div>

        <!-- QR Code Modal Popup -->
        <div id="qrModal" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-6 transition-opacity">
            <div class="bg-white rounded-3xl p-6 w-full max-w-[280px] text-center shadow-2xl relative text-slate-800">
                <button onclick="toggleModal('qrModal')" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <h3 class="text-lg font-bold mb-1">Scan QR Code</h3>
                <p class="text-xs text-slate-500 mb-4">Share Kevin's contact card</p>
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 flex justify-center mb-3">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://example.com/kevin-smith" alt="QR Code" class="w-40 h-40 rounded-lg">
                </div>
                <p class="text-[11px] text-slate-400">Point phone camera to scan</p>
            </div>
        </div>

        <!-- Toast Notification Box -->
        <div id="toast" class="hidden absolute top-6 left-1/2 -translate-x-1/2 bg-navyBrand-DEFAULT text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl z-50 flex items-center space-x-2 border border-slate-700">
            <i class="fa-solid fa-circle-check text-lime-400"></i>
            <span id="toastMessage">Action completed!</span>
        </div>

    </div>

    <script>
        // Modal toggle logic
        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.toggle('hidden');
        }

        // Copy Shareable Link logic
        function shareCard() {
            const dummyUrl = window.location.href;
            
            const el = document.createElement('textarea');
            el.value = dummyUrl;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            showToast('Card link copied to clipboard!');
        }

        // Download vCard Contact File
        function downloadVCard() {
            const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:Kevin Smith
TITLE:Sr. Marketing Manager
ORG:D. Agency
TEL;TYPE=CELL:+1234567890
EMAIL:kevin.smith@example.com
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Kevin_Smith.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast('Contact file downloaded!');
        }

        // Display Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
