<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Samantha Johnson - Senior Marketing Manager | Stellar Solutions Inc.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1e1a20;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Responsive Wrapper */
        .app-viewport {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for iOS/Android mobile browsers */
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, #3a323c 0%, #151217 100%);
            padding: 16px;
        }

        /* Desktop Smartphone Bezel Container */
        .phone-container {
            width: 100%;
            max-width: 390px;
            height: 100%;
            max-height: 840px;
            position: relative;
            margin: auto;
            display: flex;
            flex-direction: column;
            border-radius: 44px;
            background-color: #ffffff;
            box-shadow: 
                0 0 0 10px #110e12,
                0 0 0 12px rgba(255, 255, 255, 0.12),
                0 25px 60px 20px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        /* Mobile full-bleed overrides */
        @media (max-width: 480px) {
            .app-viewport {
                padding: 0 !important;
                background: #ffffff !important;
            }

            .phone-container {
                max-width: 100% !important;
                max-height: 100% !important;
                height: 100dvh !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }

            .phone-notch, .phone-home-indicator {
                display: none !important;
            }
        }

        /* Top Notch Bar */
        .phone-notch {
            width: 100%;
            height: 30px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 40;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .notch-bar {
            width: 96px;
            height: 14px;
            background-color: #110e12;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
        }

        .notch-speaker {
            width: 36px;
            height: 3px;
            background-color: #2c252f;
            border-radius: 2px;
        }

        .notch-camera {
            width: 6px;
            height: 6px;
            background-color: #211c23;
            border-radius: 50%;
        }

        /* Top Wave Banner Header */
        .header-curve-wrapper {
            position: relative;
            width: 100%;
            height: 135px;
            background-color: #C8BEBF; /* Soft Taupe Tone */
            overflow: hidden;
            flex-shrink: 0;
        }

        .curve-svg {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 52px;
        }

        /* Profile Avatar Overlapping Header */
        .avatar-container {
            position: relative;
            margin-top: -62px;
            z-index: 20;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            background-color: #f3f0f1;
        }

        /* Soft Mauve Icon Button */
        .soft-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f4ecee;
            color: #614650;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .contact-row:hover .soft-icon-btn {
            background-color: #e5d8db;
            color: #432e36;
            transform: scale(1.05);
        }

        /* Copy Button Icon */
        .copy-btn {
            opacity: 0.3;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .contact-row:hover .copy-btn {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Social Brand Buttons */
        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .social-btn:active {
            transform: translateY(0);
        }

        /* Scrollbar Styling */
        .scroll-content::-webkit-scrollbar {
            width: 3px;
        }
        .scroll-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .scroll-content::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- MAIN VIEWPORT WRAPPER -->
    <div class="app-viewport">

        <!-- SMARTPHONE DEVICE MOCKUP FRAME -->
        <div class="phone-container">

            <!-- Top Camera & Speaker Notch -->
            <div class="phone-notch">
                <div class="notch-bar">
                    <div class="notch-speaker"></div>
                    <div class="notch-camera"></div>
                </div>
            </div>

            <!-- SCROLLABLE BODY CONTENT -->
            <div class="flex-1 overflow-y-auto scroll-content relative bg-white flex flex-col justify-between">
                
                <div>
                    <!-- TOP HEADER BANNER WITH TAUPE ARC -->
                    <div class="header-curve-wrapper">
                        <!-- Concave Arc Curve Cutout SVG -->
                        <svg class="curve-svg" viewBox="0 0 500 150" preserveAspectRatio="none">
                            <path d="M 0,0 Q 250,115 500,0 L 500,150 L 0,150 Z" fill="#ffffff"></path>
                        </svg>
                    </div>

                    <!-- PROFILE AVATAR OVERLAY -->
                    <div class="avatar-container">
                        <img src="https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?auto=format&fit=crop&q=80&w=400&h=400" 
                             alt="Samantha Johnson" 
                             onerror="this.src='https://placehold.co/400x400/C8BEBF/432e36?text=Samantha';"
                             class="avatar-img">
                    </div>

                    <!-- MAIN PROFILE INFO SECTION -->
                    <div class="px-6 pt-3 pb-4 text-center">
                        
                        <!-- NAME & PRONOUNS -->
                        <h1 class="text-xl font-extrabold text-gray-800 tracking-tight leading-snug">
                            Samantha Johnson <span class="text-xs font-normal text-gray-400 italic ml-1">(she/her)</span>
                        </h1>

                        <!-- TITLE & COMPANY -->
                        <p class="text-xs font-medium text-gray-400 mt-1">
                            Senior Marketing Manager
                        </p>
                        <p class="text-xs font-semibold text-gray-700 mt-0.5 tracking-wide">
                            Stellar Solutions Inc.
                        </p>

                        <!-- EXECUTIVE BIO -->
                        <div class="mt-4 px-1">
                            <p class="text-xs font-bold text-gray-800 leading-relaxed max-w-[290px] mx-auto">
                                Strategic and adaptive marketing lead with 10+ years of experience creating product awareness that drives sales.
                            </p>
                        </div>

                        <!-- CONTACT LIST ROWS -->
                        <div class="mt-6 space-y-4 text-left px-1">
                            
                            <!-- Phone Row -->
                            <div class="contact-row flex items-center justify-between group cursor-pointer p-1 rounded-xl hover:bg-gray-50 transition-colors"
                                 onclick="handleContactClick(event, 'tel:+12345678901', '+1 (234) 567-8901')">
                                <div class="flex items-center space-x-3.5">
                                    <div class="soft-icon-btn">
                                        <i class="fa-solid fa-phone"></i>
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-xs font-bold text-gray-800 group-hover:text-[#614650] transition-colors">
                                            +1 (234) 567-8901
                                        </span>
                                        <span class="text-[10px] font-medium text-gray-400">Work</span>
                                    </div>
                                </div>
                                <button class="copy-btn text-gray-400 p-2" title="Copy Phone Number" onclick="copyToClipboard(event, '+12345678901', 'Phone number copied!')">
                                    <i class="fa-regular fa-copy text-xs"></i>
                                </button>
                            </div>

                            <!-- Email Row -->
                            <div class="contact-row flex items-center justify-between group cursor-pointer p-1 rounded-xl hover:bg-gray-50 transition-colors"
                                 onclick="handleContactClick(event, 'mailto:samantha@stellarsolutions.com', 'samantha@stellarsolutions.com')">
                                <div class="flex items-center space-x-3.5 overflow-hidden">
                                    <div class="soft-icon-btn">
                                        <i class="fa-solid fa-envelope"></i>
                                    </div>
                                    <div class="flex flex-col overflow-hidden">
                                        <span class="text-xs font-bold text-gray-800 group-hover:text-[#614650] transition-colors truncate">
                                            samantha@stellarsolutions.com
                                        </span>
                                        <span class="text-[10px] font-medium text-gray-400">Work</span>
                                    </div>
                                </div>
                                <button class="copy-btn text-gray-400 p-2 shrink-0 ml-1" title="Copy Email" onclick="copyToClipboard(event, 'samantha@stellarsolutions.com', 'Email copied!')">
                                    <i class="fa-regular fa-copy text-xs"></i>
                                </button>
                            </div>

                            <!-- Website Row -->
                            <div class="contact-row flex items-center justify-between group cursor-pointer p-1 rounded-xl hover:bg-gray-50 transition-colors"
                                 onclick="handleContactClick(event, 'https://www.stellarsolutions.com', 'www.stellarsolutions.com')">
                                <div class="flex items-center space-x-3.5">
                                    <div class="soft-icon-btn">
                                        <i class="fa-solid fa-globe"></i>
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-xs font-bold text-gray-800 group-hover:text-[#614650] transition-colors">
                                            www.stellarsolutions.com
                                        </span>
                                        <span class="text-[10px] font-medium text-gray-400">Work</span>
                                    </div>
                                </div>
                                <button class="copy-btn text-gray-400 p-2" title="Copy Website URL" onclick="copyToClipboard(event, 'https://www.stellarsolutions.com', 'Website link copied!')">
                                    <i class="fa-regular fa-copy text-xs"></i>
                                </button>
                            </div>

                        </div>

                        <!-- SOCIAL MEDIA BRAND BUTTONS ROW -->
                        <div class="mt-7 mb-2 flex items-center justify-center space-x-4">
                            <!-- Facebook -->
                            <a href="#" onclick="handleSocialClick(event, 'Facebook')" 
                               class="social-btn bg-[#1877f2] text-white">
                                <i class="fa-brands fa-facebook-f"></i>
                            </a>

                            <!-- Instagram -->
                            <a href="#" onclick="handleSocialClick(event, 'Instagram')" 
                               class="social-btn text-white" 
                               style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);">
                                <i class="fa-brands fa-instagram"></i>
                            </a>

                            <!-- Twitter/X -->
                            <a href="#" onclick="handleSocialClick(event, 'Twitter / X')" 
                               class="social-btn bg-[#000000] text-white">
                                <i class="fa-brands fa-x-twitter"></i>
                            </a>

                            <!-- LinkedIn -->
                            <a href="#" onclick="handleSocialClick(event, 'LinkedIn')" 
                               class="social-btn bg-[#0a66c2] text-white">
                                <i class="fa-brands fa-linkedin-in"></i>
                            </a>
                        </div>

                    </div>
                </div>

                <!-- FIXED BOTTOM ACTION BAR BUTTON -->
                <div class="p-3.5 bg-white shrink-0 mt-2 border-t border-gray-100">
                    <button onclick="downloadVCard()" 
                            class="w-full py-3.5 px-4 bg-[#C8BEBF] hover:bg-[#b8acae] active:bg-[#a89b9d] text-[#3d2c33] rounded-2xl font-extrabold text-xs tracking-wide transition-all shadow-sm active:scale-[0.99] flex items-center justify-center space-x-2">
                        <span class="text-base font-semibold leading-none">+</span>
                        <span>Add to Contacts</span>
                    </button>
                </div>

            </div>

            <!-- Home Bar Indicator -->
            <div class="phone-home-indicator w-full h-4 bg-white flex items-center justify-center shrink-0 z-30 pb-1">
                <div class="w-28 h-1 bg-gray-300 rounded-full"></div>
            </div>

        </div>

    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md text-white px-5 py-2.5 rounded-full shadow-2xl text-xs font-semibold opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2.5 border border-gray-700/60">
        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
        <span id="toast-message">Notification</span>
    </div>

    <script>
        // Toast Notification Trigger
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2300);
        }

        // Copy content helper using standard clipboard technique
        function copyToClipboard(e, text, successMsg) {
            e.stopPropagation();
            e.preventDefault();
            
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (err) {
                showToast('Failed to copy');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Contact Item Click Handler
        function handleContactClick(e, href, label) {
            // Avoid triggering if copy button was clicked
            if (e.target.closest('.copy-btn')) return;
            
            if (href.startsWith('tel:') || href.startsWith('mailto:')) {
                window.location.href = href;
            } else {
                window.open(href, '_blank');
            }
        }

        // Social Media Link Handler
        function handleSocialClick(e, platform) {
            e.preventDefault();
            showToast(`Opening Samantha's ${platform}...`);
        }

        // vCard Download Generator (.vcf)
        function downloadVCard() {
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'FN:Samantha Johnson',
                'N:Johnson;Samantha;;;',
                'TITLE:Senior Marketing Manager',
                'ORG:Stellar Solutions Inc.',
                'TEL;TYPE=WORK,VOICE:+12345678901',
                'EMAIL;TYPE=WORK:samantha@stellarsolutions.com',
                'URL;TYPE=WORK:https://www.stellarsolutions.com',
                'NOTE:Strategic and adaptive marketing lead with 10+ years of experience creating product awareness that drives sales. She/Her.',
                'END:VCARD'
            ].join('\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Samantha_Johnson.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);

            showToast('Saved Samantha Johnson to contacts!');
        }
    </script>
</body>
</html>
